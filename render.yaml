# Render Blueprint — https://dashboard.render.com/blueprints
# After deploy: set frontend env VITE_API_URL to the API public URL and redeploy web.

services:
  - type: web
    name: estate-manager-api
    runtime: docker
    rootDir: backend/estate-manager-api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estate-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3000"
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: estate-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: estate-manager-db
    plan: free
    databaseName: estate_manager_db
    user: estate_manager
