# Render Blueprint — free tier uses native Node (Docker requires a paid plan).
# After first deploy, confirm both services are Live, then log in at the web URL.
# IMPORTANT: copy the exact API URL from the Render service page into VITE_API_URL
# (it may include a random suffix, e.g. raut-estate-api.onrender.com).

services:
  - type: web
    name: raut-estate-api
    runtime: node
    plan: free
    rootDir: backend/estate-manager-api
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Free-tier builds can't reach the database, so migrations run at start.
    # `db push` is slow enough on free CPU that boots time out, so it only runs
    # when PRISMA_DB_PUSH_ON_START=true (set it for one deploy after a schema
    # change that has no migration, then unset it).
    startCommand: ./node_modules/.bin/prisma migrate deploy && if [ "$PRISMA_DB_PUSH_ON_START" = "true" ]; then ./node_modules/.bin/prisma db push --skip-generate; fi && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: estate-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://estate-manager-web.onrender.com
      - key: PUBLIC_APP_URL
        value: https://estate-manager-web.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_IMAGE_MODEL
        value: dall-e-3

  - type: web
    name: estate-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://raut-estate-api.onrender.com

databases:
  - name: estate-manager-db
    plan: free
    databaseName: estate_manager_db
    user: estate_manager
