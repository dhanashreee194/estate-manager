# Render Blueprint — free tier uses native Node (Docker requires a paid plan).
# After first deploy:
# 1. Set estate-manager-api CORS_ORIGIN to the static site URL
# 2. Set estate-manager-web VITE_API_URL to the API URL
# 3. Manual Deploy both services

services:
  - type: web
    name: estate-manager-api
    runtime: node
    plan: free
    rootDir: backend/estate-manager-api
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: estate-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: estate-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false

databases:
  - name: estate-manager-db
    plan: free
    databaseName: estate_manager_db
    user: estate_manager
