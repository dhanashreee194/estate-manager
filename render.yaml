# Render Blueprint — free tier uses native Node (Docker requires a paid plan).
# After first deploy, confirm both services are Live, then log in at the web URL.

services:
  - type: web
    name: estate-manager-api
    runtime: node
    plan: free
    rootDir: backend/estate-manager-api
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: estate-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://estate-manager-web.onrender.com

  - type: web
    name: estate-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://estate-manager-api.onrender.com

databases:
  - name: estate-manager-db
    plan: free
    databaseName: estate_manager_db
    user: estate_manager
