name: Keep API awake

# Render free web services sleep after 15 minutes without traffic, and waking
# takes minutes. Pinging /health keeps the API warm for users.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 180 https://raut-estate-api.onrender.com/health || echo "000")
          echo "health status: $code"
